<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumio Ultimate</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #1a1a2e; color: #fff; display: flex; flex-direction: column; height: 100vh; }
        
        /* Стили для экрана авторизации */
        #auth-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #16213e; display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .auth-box { background: #0f3460; padding: 30px; border-radius: 12px; width: 300px; text-align: center; box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
        .auth-box h2 { margin-top: 0; color: #e94560; }
        .auth-tabs { display: flex; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 10px; background: transparent; border: none; color: #aaa; cursor: pointer; border-bottom: 2px solid transparent; font-weight: bold; }
        .tab-btn.active { color: #fff; border-bottom: 2px solid #e94560; }
        .auth-box input { width: 100%; padding: 12px; margin: 8px 0; border: none; border-radius: 6px; background: #1a1a2e; color: #fff; box-sizing: border-box; }
        .auth-box button { width: 100%; padding: 12px; margin-top: 15px; background: #e94560; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 16px; }
        .auth-box button:hover { background: #ff2e63; }
        .error-msg { color: #ff6b6b; font-size: 14px; margin-top: 10px; min-height: 20px; }

        /* Стили чата (скрыты до входа) */
        #chat-app { display: none; flex: 1; flex-direction: column; height: 100%; }
        header { background: #0f3460; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        #messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .message { background: #0f3460; padding: 10px 15px; border-radius: 12px; max-width: 80%; align-self: flex-start; }
        .message.own { background: #e94560; align-self: flex-end; }
        .message .meta { font-size: 12px; opacity: 0.7; margin-bottom: 4px; }
        #input-area { padding: 15px; background: #0f3460; display: flex; gap: 10px; }
        #message-input { flex: 1; padding: 12px; border: none; border-radius: 6px; background: #1a1a2e; color: #fff; }
        #send-btn { padding: 12px 20px; background: #e94560; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
        #logout-btn { background: transparent; border: 1px solid #e94560; color: #e94560; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

    <!-- Экран Входа / Регистрации -->
    <div id="auth-overlay">
        <div class="auth-box">
            <h2>🔐 Lumio</h2>
            <div class="auth-tabs">
                <button class="tab-btn active" onclick="showTab('login')">Вход</button>
                <button class="tab-btn" onclick="showTab('register')">Регистрация</button>
            </div>
            
            <form id="login-form">
                <input type="text" id="login-username" placeholder="Имя пользователя" required>
                <input type="password" id="login-password" placeholder="Пароль" required>
                <button type="submit">Войти</button>
                <p id="login-error" class="error-msg"></p>
            </form>

            <form id="register-form" style="display: none;">
                <input type="text" id="reg-username" placeholder="Придумайте имя" required>
                <input type="password" id="reg-password" placeholder="Придумайте пароль" required>
                <button type="submit">Зарегистрироваться</button>
                <p id="reg-error" class="error-msg"></p>
            </form>
        </div>
    </div>

    <!-- Основное приложение чата -->
    <div id="chat-app">
        <header>
            <span id="current-user-display">Гость</span>
            <button id="logout-btn" onclick="logout()">Выйти</button>
        </header>
        <div id="messages"></div>
        <div id="input-area">
            <input type="text" id="message-input" placeholder="Введите сообщение...">
            <button id="send-btn">➤</button>
        </div>
    </div>

    <script>
        let ws;
        let currentUsername = '';
        let currentUserId = '';

        // Проверка при загрузке страницы: есть ли сохраненный вход
        window.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('lumio_token');
            const username = localStorage.getItem('lumio_username');
            
            if (token && username) {
                currentUsername = username;
                document.getElementById('current-user-display').textContent = username;
                document.getElementById('auth-overlay').style.display = 'none';
                document.getElementById('chat-app').style.display = 'flex';
                connectWebSocket(token);
            }
        });

        // Переключение вкладок Вход / Регистрация
        function showTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            if (tab === 'login') {
                document.getElementById('login-form').style.display = 'block';
                document.getElementById('register-form').style.display = 'none';
            } else {
                document.getElementById('login-form').style.display = 'none';
                document.getElementById('register-form').style.display = 'block';
            }
        }

        // Обработка Входа
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('login-username').value;
            const password = document.getElementById('login-password').value;
            const errorMsg = document.getElementById('login-error');
            errorMsg.textContent = 'Вход...';

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (data.success) {
                    localStorage.setItem('lumio_token', data.token);
                    localStorage.setItem('lumio_username', data.username);
                    currentUsername = data.username;
                    document.getElementById('auth-overlay').style.display = 'none';
                    document.getElementById('chat-app').style.display = 'flex';
                    document.getElementById('current-user-display').textContent = data.username;
                    connectWebSocket(data.token);
                } else {
                    errorMsg.textContent = data.error || 'Ошибка входа';
                }
            } catch (err) {
                errorMsg.textContent = 'Ошибка сети';
            }
        });

        // Обработка Регистрации
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('reg-username').value;
            const password = document.getElementById('reg-password').value;
            const errorMsg = document.getElementById('reg-error');
            errorMsg.textContent = 'Регистрация...';

            try {
                const res = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (data.success) {
                    localStorage.setItem('lumio_token', data.token);
                    localStorage.setItem('lumio_username', data.username);
                    currentUsername = data.username;
                    document.getElementById('auth-overlay').style.display = 'none';
                    document.getElementById('chat-app').style.display = 'flex';
                    document.getElementById('current-user-display').textContent = data.username;
                    connectWebSocket(data.token);
                } else {
                    errorMsg.textContent = data.error || 'Ошибка регистрации';
                }
            } catch (err) {
                errorMsg.textContent = 'Ошибка сети';
            }
        });

        // Выход из системы
        function logout() {
            localStorage.removeItem('lumio_token');
            localStorage.removeItem('lumio_username');
            if (ws) ws.close();
            location.reload();
        }

        // Подключение к WebSocket с токеном
        function connectWebSocket(token) {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${window.location.host}`);

            ws.onopen = () => {
                console.log('Connected to server');
                ws.send(JSON.stringify({ type: 'auth', token: token }));
            };

            ws.onmessage = (event) => {
                const msg = JSON.parse(event.data);
                
                if (msg.type === 'auth_success') {
                    currentUserId = msg.userId;
                    loadHistory();
                    return;
                }
                
                if (msg.type === 'auth_error') {
                    alert('Сессия истекла. Пожалуйста, войдите снова.');
                    logout();
                    return;
                }

                if (msg.type === 'history') {
                    const messagesDiv = document.getElementById('messages');
                    messagesDiv.innerHTML = '';
                    msg.messages.forEach(m => appendMessage(m.fromName, m.text, m.from === currentUserId));
                    messagesDiv.scrollTop = messagesDiv.scrollHeight;
                    return;
                }

                if (msg.type === 'chat_message') {
                    appendMessage(msg.message.fromName, msg.message.text, msg.message.from === currentUserId);
                    const messagesDiv = document.getElementById('messages');
                    messagesDiv.scrollTop = messagesDiv.scrollHeight;
                }
            };

            ws.onclose = () => console.log('Disconnected');
        }

        // Отправка сообщения
        document.getElementById('send-btn').addEventListener('click', sendMessage);
        document.getElementById('message-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        function sendMessage() {
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (!text || !ws || ws.readyState !== 1) return;

            ws.send(JSON.stringify({
                type: 'chat_message',
                text: text,
                encrypted: false
            }));
            input.value = '';
        }

        function appendMessage(username, text, isOwn) {
            const messagesDiv = document.getElementById('messages');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${isOwn ? 'own' : ''}`;
            msgDiv.innerHTML = `<div class="meta">${username}</div><div>${text}</div>`;
            messagesDiv.appendChild(msgDiv);
        }

        function loadHistory() {
            ws.send(JSON.stringify({ type: 'join_room', roomId: 'general' }));
        }
    </script>
</body>
</html>
